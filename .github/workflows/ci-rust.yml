name: CI (Rust)

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/ci-rust.yml
      - packages/bridge-c/**
      - packages/bridge-wasm/**
      - packages/engine/**
      - packages/proto/**
      - packages/server/**
  pull_request:
    paths:
      - .github/workflows/ci-rust.yml
      - packages/bridge-c/**
      - packages/bridge-wasm/**
      - packages/engine/**
      - packages/proto/**
      - packages/server/**

jobs:
  build-rust:
    runs-on: ubuntu-latest
    env:
      SERVER_SENTRY_DSN: https://9965738e8eac44b9922b71951141f59d@o387306.ingest.sentry.io/5222373
      # Runs cargo in the same image as the server's Dockerfile: the pinned openssl-sys
      # requires OpenSSL 1.1, which current runners don't have
      IN_RUST_IMAGE: >-
        docker run --rm -e SERVER_SENTRY_DSN -v ${{ github.workspace }}/packages:/app
        -v cargo-registry:/usr/local/cargo/registry -w /app rust:1.46-buster
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: $IN_RUST_IMAGE cargo build --verbose
      - name: Test
        run: $IN_RUST_IMAGE cargo test --verbose
      - name: Clippy
        run: $IN_RUST_IMAGE sh -c "rustup component add clippy && cargo clippy"
