name: CI (Rust)

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/ci-rust.yml
      - packages/bridge-c/**
      - packages/bridge-wasm/**
      - packages/engine/**
      - packages/proto/**
      - packages/server/**
  pull_request:
    paths:
      - .github/workflows/ci-rust.yml
      - packages/bridge-c/**
      - packages/bridge-wasm/**
      - packages/engine/**
      - packages/proto/**
      - packages/server/**

jobs:
  build-rust:
    runs-on: ubuntu-latest
    env:
      SERVER_SENTRY_DSN: https://9965738e8eac44b9922b71951141f59d@o387306.ingest.sentry.io/5222373
    steps:
      - uses: actions/checkout@v4
      # Matches the server's Dockerfile
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.46.0
          components: clippy
      - name: Build
        working-directory: packages
        run: cargo build --verbose
      - name: Test
        working-directory: packages
        run: cargo test --verbose
      - name: Clippy
        working-directory: packages
        run: cargo clippy
