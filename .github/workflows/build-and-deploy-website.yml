name: Build and Deploy Website

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - .github/workflows/build-and-deploy-website.yml
      - packages/bridge-wasm/**
      - packages/engine/**
      - packages/proto/**
      - packages/web/**

jobs:
  build-and-deploy-website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 14
      # The pinned wasm-bindgen doesn't build on newer Rust
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.46.0
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.9.1
      - name: Install Dependencies
        working-directory: packages/web
        run: npm ci
      - name: Prepare
        id: prep
        run: |
          SENTRY_RELEASE="instantbible-web@$(echo $GITHUB_SHA | head -c7)"
          echo ::set-output name=sentry_release::$SENTRY_RELEASE
      - name: Build
        working-directory: packages/web
        env:
          SENTRY_RELEASE: ${{ steps.prep.outputs.sentry_release }}
        run: npm run build
      - name: Deploy
        working-directory: packages/web
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npm run deploy -- --message $(echo $GITHUB_SHA | head -c7)
