name: CI (Web)

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/ci-web.yml
      - packages/bridge-wasm/**
      - packages/engine/**
      - packages/proto/**
      - packages/web/**
  pull_request:
    paths:
      - .github/workflows/ci-web.yml
      - packages/bridge-wasm/**
      - packages/engine/**
      - packages/proto/**
      - packages/web/**

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 14
      # The pinned wasm-bindgen doesn't build on newer Rust
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.46.0
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.9.1
      - name: Install
        working-directory: packages/web
        run: npm ci
      - name: Build
        working-directory: packages/web
        run: npm run build
      - name: Check
        working-directory: packages/web
        run: npm run check
